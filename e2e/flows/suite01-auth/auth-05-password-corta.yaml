# auth-05-password-corta
# Flow: Login with documento and short password → assert validation error

appId: host.exp.exponent
---
- assertVisible:
    text: "Iniciar sesión"
- tapOn:
    id: "welcome-login-btn"
- assertVisible: "Bienvenido"
- tapOn:
    id: "login-documento-input"
- inputText: "12345678"
- tapOn:
    id: "login-password-input"
- inputText: "abc"
- tapOn:
    id: "login-submit-btn"
- assertVisible:
    text: "Mínimo 8 caracteres"
