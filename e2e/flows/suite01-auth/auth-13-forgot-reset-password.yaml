# auth-13-forgot-reset-password
# Flow: Forgot Password → send email → navigate to reset → enter code and new password
#
# Note: This test requires a valid email registered in the system.
# The actual email delivery is mocked/simulated in E2E environments.

appId: host.exp.exponent
---
- assertVisible:
    text: "Iniciar sesión"
- tapOn:
    id: "welcome-login-btn"
- assertVisible: "Bienvenido"

# Navigate to Forgot Password
- tapOn:
    id: "login-forgot-link"
- assertVisible:
    id: "forgot-email-input"

# Enter email and submit
- tapOn:
    id: "forgot-email-input"
- inputText: "juan.e2e@example.com"
- tapOn:
    id: "forgot-submit-btn"
# Wait for async operation (API call to send reset email)
- assertVisible:
    text: "Código"
    optional: true

# Navigate to Reset Password via "Tengo un código" link
- tapOn:
    id: "forgot-tengo-codigo-link"
- assertVisible:
    id: "reset-code-input"

# Fill reset code
- tapOn:
    id: "reset-code-input"
- inputText: "123456"

# Fill new password
- tapOn:
    id: "reset-password-input"
- inputText: "newpass123"

# Fill confirm new password
- tapOn:
    id: "reset-confirm-input"
- inputText: "newpass123"

# Submit password update
- tapOn:
    id: "reset-submit-btn"
# Wait for async operation
- assertVisible:
    text: "Bienvenido"
    optional: true
