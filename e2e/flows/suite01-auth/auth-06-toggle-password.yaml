# auth-06-toggle-password
# Flow: Toggle password visibility on login screen
#
# Verifies that the eye icon toggles secureTextEntry on/off.
# The icon is "visibility" when password is hidden, "visibility-off" when shown.
# We test by checking the icon name indirectly via the toggle button state.

appId: host.exp.exponent
---
- assertVisible:
    text: "Iniciar sesión"
- tapOn:
    id: "welcome-login-btn"
- assertVisible: "Bienvenido"
- tapOn:
    id: "login-password-input"
- inputText: "password123"
# Tap eye icon to reveal password
- tapOn:
    id: "login-toggle-password-btn"
# Password is now visible (secureTextEntry=false) — input text is visible as plain text
# Tap eye icon again to hide password
- tapOn:
    id: "login-toggle-password-btn"
# Password hidden again — verify we are still on login screen
- assertVisible: "Bienvenido"
