# Suite 3 - Authenticated Subastas
# sub-09-sse: Verify real-time SSE updates on live auction

# @skip: Para CI, este test requiere un backend mock que emite eventos SSE controlados.
# Se recomienda correr manualmente con una subasta en vivo real.

tags: [skip-ci]

appId: host.exp.exponent
---
- runFlow:
    file: ../_helpers/login.yaml
# Navigate to Live tab
- tapOn: "En Vivo"
# Assert live auction lobby is visible
- assertVisible:
    id: "live-login-btn"
    optional: true
# Tap on a live auction to join
- scrollUntilVisible:
    element:
      text: "${E2E_SUBASTA_ID_EN_VIVO:-800011}"
    direction: DOWN
- tapOn:
    text: "${E2E_SUBASTA_ID_EN_VIVO:-800011}"
# Assert "EN VIVO" indicator is visible in the auction
- assertVisible:
    text: "EN VIVO"
    optional: true
# Assert auction details are present and updating
- assertVisible:
    id: "live-bid-input"
- assertVisible:
    id: "live-bid-send-btn"
# NOTE: The SSE stream test is inherently flaky in CI without a controlled backend.
# Real-time updates (price changes, time remaining) require a running auction with active bids.
# This test validates the SSE connection is established and the UI renders live data.
