# Suite 5 - Consignar
# cons-02-envio: Complete full consignment flow through all 4 steps and submit

appId: host.exp.exponent
---
- runFlow:
    file: ../_helpers/login.yaml
# Navigate to Consignar via Profile
- tapOn: "Perfil"
- tapOn:
    id: "profile-tab-subastas"
- scrollUntilVisible:
    element:
      id: "profile-consignar-btn"
    direction: DOWN
- tapOn:
    id: "profile-consignar-btn"
# === STEP 1: Información Básica ===
- assertVisible: "Paso 1 de 4"
- tapOn:
    id: "consignar-titulo-input"
- inputText: "Reloj E2E Test"
- tapOn:
    id: "consignar-categoria-picker"
- tapOn: "Especial"
- tapOn:
    id: "consignar-desc-input"
- inputText: "Reloj de prueba para E2E"
- tapOn:
    id: "consignar-continuar-btn"
# === STEP 2: Historia y Valoración ===
- assertVisible: "Paso 2 de 4"
- assertVisible: "Historia y Valoración"
- tapOn:
    id: "consignar-historia-input"
- inputText: "Perteneció a colección privada"
- tapOn:
    id: "consignar-artista-input"
- inputText: "Desconocido"
- tapOn:
    id: "consignar-fecha-input"
- inputText: "1900-01-01"
- tapOn:
    id: "consignar-valor-input"
- inputText: "15000"
# Check required declarations
- tapOn:
    id: "consignar-check-propietario"
- tapOn:
    id: "consignar-check-licito"
- tapOn:
    id: "consignar-continuar-btn"
# === STEP 3: Imágenes ===
- assertVisible: "Paso 3 de 4"
- assertVisible: "Imágenes del Artículo"
# NOTE: Photo upload requires real images on the simulator/device.
# Skipping actual photo upload; proceed directly to submit.
# In a real device test, uncomment the following:
# - tapOn:
#     id: "consignar-foto-btn"
# (Simulator must have pre-loaded images in the gallery)
- tapOn:
    id: "consignar-continuar-btn"
# Expect validation error about minimum 6 photos
- assertVisible: "Se requieren al menos 6 fotos"
- tapOn: "OK"
# The flow ends here since photo upload cannot be automated without pre-loaded sim images.
# Manual verification: after adding 6+ photos, tapping "Continuar" in step 3 triggers submit.
