# Helper flow: Login as USUARIO_VALIDO (documento 12345678, password password123)
# Include this in tests that require an authenticated session.
#
# Usage in test YAML:
#   - runFlow:
#       file: ../_helpers/login.yaml

appId: host.exp.exponent
---
- tapOn:
    id: "welcome-login-btn"
- assertVisible: "Bienvenido"
- tapOn:
    id: "login-documento-input"
- inputText: "${E2E_USER_DOCUMENTO:-12345678}"
- tapOn:
    id: "login-password-input"
- inputText: "${E2E_USER_PASSWORD:-password123}"
- tapOn:
    id: "login-submit-btn"
- assertVisible: "Inicio"
