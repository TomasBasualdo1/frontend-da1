# Helper flow: Logout from profile
# Requires user is authenticated and on a screen with tab bar.
#
# Usage in test YAML:
#   - runFlow:
#       file: ../_helpers/logout.yaml

appId: host.exp.exponent
---
- tapOn: "Perfil"
- scrollUntilVisible:
    element:
      id: "profile-logout-btn"
    direction: DOWN
- tapOn:
    id: "profile-logout-btn"
- assertVisible: "Cerrar sesion"
- tapOn: "Cerrar sesión"
- assertVisible: "Iniciar sesión"
